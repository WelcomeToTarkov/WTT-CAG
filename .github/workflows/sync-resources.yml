name: Sync 4.0 resources to 4.1

on:
  push:
    branches: 
      - '4.0'
    paths:
      - 'WTT-CAG/Resources/**'
  workflow_dispatch: {}
  
permissions: 
  contents: write
  
jobs:
  sync-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 4.1-dev
        uses: actions/checkout@v7.0.1
        with: 
          ref: 4.1-dev
          fetch-depth: 0
      
      - name: Pull Resources folder from 4.0
        run: |
          git fetch origin 4.0
          git rm -r --ignore-unmatch WTT-CAG/Resources
          git restore --source origin/4.0 --staged --worktree WTT-CAG/Resources
      
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A WTT-CAG/Resources
          if git diff --cached --quiet; then
            echo "Resources folder already up to date, nothing to commit."
          else
            git commit -m "chore: sync WTT-CAG/Resources folder from 4.0"
            git push origin HEAD:4.1-dev
          fi